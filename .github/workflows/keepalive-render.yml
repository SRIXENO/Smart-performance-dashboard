name: Keep Render Awake

on:
  schedule:
    # Every 10 minutes
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Validate healthcheck URL
        run: |
          if [ -z "${{ secrets.RENDER_HEALTHCHECK_URL }}" ]; then
            echo "Missing secret RENDER_HEALTHCHECK_URL"
            exit 1
          fi

      - name: Ping backend health endpoint
        run: |
          URL="${{ secrets.RENDER_HEALTHCHECK_URL }}"
          echo "Pinging $URL"
          curl --silent --show-error --fail \
            --connect-timeout 8 \
            --max-time 20 \
            --retry 2 \
            --retry-delay 2 \
            "$URL"
